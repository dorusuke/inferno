name: Probe URLs
on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/probe.yml"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check URLs
        run: |
          B=https://github.com/k2-fsa/sherpa-onnx/releases/download
          {
            for u in \
              asr-models/sherpa-onnx-whisper-tiny.tar.bz2 \
              asr-models/sherpa-onnx-whisper-base.tar.bz2 \
              asr-models/sherpa-onnx-whisper-small.tar.bz2 \
              asr-models/sherpa-onnx-whisper-small.en.tar.bz2 \
              asr-models/sherpa-onnx-whisper-distil-small.en.tar.bz2 \
              asr-models/sherpa-onnx-whisper-turbo.tar.bz2 \
              asr-models/sherpa-onnx-moonshine-tiny-en-int8.tar.bz2 \
              asr-models/sherpa-onnx-moonshine-base-en-int8.tar.bz2 \
              asr-models/sherpa-onnx-whisper-tiny.en.tar.bz2 \
              asr-models/sherpa-onnx-whisper-base.en.tar.bz2 ; do
              r=$(curl -sL -r 0-0 -D - -o /dev/null "$B/$u" | tr -d '\r' | grep -iE "^(HTTP|content-range)" | tail -2 | tr '\n' ' ')
              echo "$u -> $r"
            done
          } > probe.txt 2>&1
          cat probe.txt
          mkdir /tmp/out && cp probe.txt /tmp/out/
          git config user.name build-bot
          git config user.email build-bot@users.noreply.github.com
          git checkout --orphan probe-output
          git rm -rf . > /dev/null 2>&1 || true
          cp /tmp/out/probe.txt .
          git add probe.txt
          git commit -m "probe ${{ github.sha }}"
          git push -f origin probe-output
